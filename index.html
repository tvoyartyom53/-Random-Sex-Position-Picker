<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Sex Position Picker</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
        h1 { margin-bottom: 20px; text-align: center; font-weight: 600; }
        .controls { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; }
        select, button { padding: 14px; font-size: 16px; border-radius: 10px; border: none; outline: none; font-weight: bold; }
        select { background: #333; color: white; flex: 1; cursor: pointer; }
        button { background-color: #e50914; color: white; cursor: pointer; transition: 0.3s; flex: 1; }
        button:hover { background-color: #ff2b36; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        .card { background: #2a2a2a; border-radius: 16px; padding: 25px; max-width: 600px; width: 100%; box-sizing: border-box; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; border: 1px solid #333; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card img { max-width: 100%; max-height: 450px; border-radius: 12px; margin-bottom: 20px; object-fit: cover; background: #111; }
        h2 { margin: 10px 0; color: #e50914; font-size: 24px; }
        p { font-size: 16px; line-height: 1.6; color: #dcdcdc; text-align: left; }
        
        .loader { margin-top: 50px; font-size: 18px; color: #888; text-align: center; display: none; }
        .error { color: #ff6b6b; margin-top: 20px; text-align: center; display: none; max-width: 600px; }
    </style>
</head>
<body>

    <h1>🎲 Случайная поза</h1>
    
    <div class="controls">
        <select id="categorySelect">
            <option value="https://medow.club/pozy/vid-seksa/vaginalnyj-seks">Вагинальный секс</option>
            <option value="https://medow.club/pozy/vid-seksa/analnyj-seks">Анальный секс</option>
            <option value="https://medow.club/pozy/vid-seksa/oralnyj-seks">Оральный секс</option>
            <option value="https://medow.club/pozy/vid-seksa/poza-69">Поза 69</option>
            <option value="https://medow.club/pozy/vid-seksa/minet">Минет</option>
            <option value="https://medow.club/pozy/vid-seksa/kunilingus">Кунилингус</option>
        </select>
        <button id="randomBtn" onclick="showRandomPose()">Показать позу</button>
    </div>

    <div id="loader" class="loader">Ищем данные в веб-архиве...<br><span style="font-size:12px;color:#666;">(займет 3-5 секунд)</span></div>
    <div id="errorMsg" class="error"></div>
    
    <div id="poseCard" class="card">
        <img id="poseImage" src="" alt="Поза" style="display:none;">
        <h2 id="poseTitle"></h2>
        <p id="poseDesc"></p>
    </div>

    <script>
        let posesCache = {};

        async function fetchFromArchive(url) {
            // Пытаемся достать сохраненную копию страницы из веб-архива
            const archiveUrl = `https://web.archive.org/web/2024id_/${url}`;
            try {
                const res = await fetch(archiveUrl);
                if (res.ok) return await res.text();
            } catch (e) {
                console.log("Архив не ответил, пробуем напрямую...");
            }
            
            // Если архив не сработал, пробуем обычный прокси
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const res = await fetch(proxyUrl);
            if (res.ok) return await res.text();
            
            throw new Error("Не удалось получить данные.");
        }

        async function showRandomPose() {
            const btn = document.getElementById('randomBtn');
            const loader = document.getElementById('loader');
            const card = document.getElementById('poseCard');
            const errorMsg = document.getElementById('errorMsg');
            const catUrl = document.getElementById('categorySelect').value;

            if (posesCache[catUrl] && posesCache[catUrl].length > 0) {
                renderPose(posesCache[catUrl]);
                return;
            }

            btn.disabled = true;
            card.style.display = 'none';
            errorMsg.style.display = 'none';
            loader.style.display = 'block';

            try {
                const htmlText = await fetchFromArchive(catUrl);

                // Если опять пришла блокировка Cloudflare
                if (htmlText.includes("Наказание") && htmlText.length < 5000) {
                    throw new Error("Сайт блокирует запрос. Попробуй выбрать другую категорию.");
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const links = doc.querySelectorAll('a[href*="/pozy/"]');
                
                let poses = [];
                let seen = new Set();

                links.forEach(link => {
                    const title = link.textContent.trim();
                    if (!title || title.length < 3 || seen.has(title) || title.includes("Наказание")) return;
                    seen.add(title);

                    let img = link.querySelector('img') || link.parentElement?.querySelector('img') || link.parentElement?.parentElement?.querySelector('img');
                    let imgUrl = '';
                    
                    if (img) {
                        let src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src');
                        if (src && !src.startsWith('data:')) {
                            if (src.startsWith('/')) src = 'https://medow.club' + src;
                            // Прогоняем картинку через кэш, чтобы она точно загрузилась
                            imgUrl = 'https://wsrv.nl/?url=' + encodeURIComponent(src) + '&w=600&output=webp';
                        }
                    }

                    let desc = 'Нажмите кнопку еще раз, чтобы увидеть другую позу.';
                    let p = link.parentElement?.querySelector('p');
                    if (p && p.textContent.trim().length > 10) {
                        desc = p.textContent.trim();
                    }

                    poses.push({ title, description: desc, image: imgUrl });
                });

                if (poses.length === 0) throw new Error("Не удалось найти позы в архиве.");

                posesCache[catUrl] = poses;
                renderPose(poses);
            } catch (error) {
                errorMsg.textContent = "Ошибка: " + error.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function renderPose(poses) {
            const card = document.getElementById('poseCard');
            const randomPose = poses[Math.floor(Math.random() * poses.length)];
            
            document.getElementById('poseTitle').textContent = randomPose.title;
            document.getElementById('poseDesc').textContent = randomPose.description;
            
            const img = document.getElementById('poseImage');
            if (randomPose.image) {
                img.src = randomPose.image;
                img.style.display = 'block';
                img.onerror = () => { img.style.display = 'none'; };
            } else { 
                img.style.display = 'none'; 
            }
            card.style.display = 'block';
        }
    </script>
</body>
</html>
