<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник поз с медиа</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --accent: #e50914;
            --text: #e0e0e0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        select, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-weight: 600;
        }
        select {
            flex: 2;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        button {
            flex: 1;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #ff1e27; }
        
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .media-container {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            position: relative;
        }
        .media-container img, .media-container video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
        }
        
        .content { padding: 20px; }
        h2 { margin: 0 0 10px 0; color: var(--accent); font-size: 22px; }
        p { margin: 0 0 15px 0; line-height: 1.5; font-size: 15px; color: #ccc; }
        
        .badge {
            display: inline-block;
            background: #333;
            color: #aaa;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .video-hint {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Позы и техники</h1>
    </header>

    <div class="controls">
        <select id="categorySelect">
            <option value="all">Все категории</option>
            <option value="Вагинальный">Вагинальный секс</option>
            <option value="Анальный">Анальный секс</option>
            <option value="Оральный">Оральный секс</option>
        </select>
        <button onclick="pickRandom()">Случайная поза</button>
    </div>

    <div id="card" class="card">
        <div id="mediaBox" class="media-container"></div>
        <div class="content">
            <span id="poseCat" class="badge"></span>
            <h2 id="poseTitle"></h2>
            <p id="poseDesc"></p>
            <div class="video-hint">* Медиаматериалы взяты из открытых источников (Wikimedia Commons) в образовательных целях.</div>
        </div>
    </div>

    <script>
        // База данных поз с открытыми медиафайлами и описаниями
        const poses = [
            {
                category: "Вагинальный",
                title: "Миссионерская",
                desc: "Классическая позиция. Женщина лежит на спине, мужчина сверху. Идеально подходит для глубокого зрительного контакта и контроля темпа.",
                image: "https://upload.wikimedia.org/wikipedia/commons/b/b8/Wiki-missionary.png",
                video: "https://upload.wikimedia.org/wikipedia/commons/3/3c/Missionary_sex_position_video.webm"
            },
            {
                category: "Вагинальный",
                title: "Догги-стайл (Сзади)",
                desc: "Женщина стоит на четвереньках, мужчина сзади. Обеспечивает глубокое проникновение и отличную стимуляцию передней стенки влагалища.",
                image: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Wiki-dstyle.png",
                video: "https://upload.wikimedia.org/wikipedia/commons/6/65/Doggy_style_sex.webm"
            },
            {
                category: "Вагинальный",
                title: "Наездница (Женщина сверху)",
                desc: "Мужчина лежит на спине, женщина сверху лицом к нему. Женщина полностью контролирует ритм, глубину и угол проникновения.",
                image: "https://upload.wikimedia.org/wikipedia/commons/0/07/Wiki-cowgirl.png",
                video: null // Видео нет, будет показана картинка
            },
            {
                category: "Вагинальный",
                title: "Ложки",
                desc: "Оба партнера лежат на боку, мужчина сзади. Расслабленная, интимная поза, отлично подходит для неспешного темпа и утреннего секса.",
                image: "https://upload.wikimedia.org/wikipedia/commons/6/6c/Wiki-spoons-sp.png",
                video: null
            },
            {
                category: "Вагинальный",
                title: "Стоя",
                desc: "Партнеры занимаются сексом стоя (с опорой на стену или держа партнершу на руках). Требует хорошей физической формы, но дает сильное чувство близости.",
                image: "https://upload.wikimedia.org/wikipedia/commons/8/8b/Wiki-standing.png",
                video: null
            },
            {
                category: "Анальный",
                title: "Анальный секс (Классический)",
                desc: "Стимуляция ануса. Требует обязательного использования смазки и расслабления. Часто практикуется в позе сзади или лежа на боку для контроля глубины.",
                image: "https://upload.wikimedia.org/wikipedia/commons/7/7f/Wiki-analsex.png",
                video: null
            },
            {
                category: "Оральный",
                title: "Поза 69",
                desc: "Взаимная оральная стимуляция. Партнеры находятся друг над другом в противоположных направлениях, что позволяет одновременно доставлять удовольствие друг другу.",
                image: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Wiki-sixtynine.png",
                video: null
            },
            {
                category: "Оральный",
                title: "Минет (Фелляция)",
                desc: "Оральная стимуляция полового члена языком и губами. Может выполняться в разных положениях: стоя, лежа или на коленях.",
                image: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Wiki-fellatio02.png",
                video: null
            },
            {
                category: "Оральный",
                title: "Кунилингус",
                desc: "Оральная стимуляция вульвы и клитора. Позволяет женщине полностью расслабиться и сконцентрироваться на ощущениях.",
                image: "https://upload.wikimedia.org/wikipedia/commons/a/ad/Wiki-cunnilingus.png",
                video: null
            }
        ];

        let currentFiltered = poses;

        function pickRandom() {
            const cat = document.getElementById('categorySelect').value;
            
            // Фильтрация
            if (cat === "all") {
                currentFiltered = poses;
            } else {
                currentFiltered = poses.filter(p => p.category === cat);
            }

            if (currentFiltered.length === 0) {
                alert("В этой категории пока нет данных.");
                return;
            }

            // Выбор случайной позы
            const pose = currentFiltered[Math.floor(Math.random() * currentFiltered.length)];
            renderCard(pose);
        }

        function renderCard(pose) {
            const card = document.getElementById('card');
            const mediaBox = document.getElementById('mediaBox');
            
            document.getElementById('poseCat').textContent = pose.category;
            document.getElementById('poseTitle').textContent = pose.title;
            document.getElementById('poseDesc').textContent = pose.desc;

            // Очистка предыдущего медиа
            mediaBox.innerHTML = '';

            // Если есть видео, показываем его, иначе — картинку
            if (pose.video) {
                const video = document.createElement('video');
                video.src = pose.video;
                video.controls = true;
                video.autoplay = true;
                video.loop = true;
                video.muted = true; // Автовоспроизведение часто требует отключения звука
                video.playsInline = true;
                mediaBox.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = pose.image;
                img.alt = pose.title;
                mediaBox.appendChild(img);
            }

            card.style.display = 'block';
        }

        // Инициализация при загрузке
        window.onload = () => {
            // Показываем случайную позу из всех при первом открытии
            pickRandom();
        };
    </script>
</body>
</html>
