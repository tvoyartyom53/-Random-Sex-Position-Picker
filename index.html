<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайная поза</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
        h1 { margin-bottom: 20px; text-align: center; font-weight: 600; }
        .controls { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; }
        select, button { padding: 14px; font-size: 16px; border-radius: 10px; border: none; outline: none; font-weight: bold; font-family: inherit; }
        select { background: #2a2a2a; color: white; flex: 1; cursor: pointer; border: 1px solid #444; }
        button { background-color: #e50914; color: white; cursor: pointer; transition: 0.3s; flex: 1; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
        button:hover { background-color: #ff2b36; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        
        .card { background: #1e1e1e; border-radius: 16px; padding: 25px; max-width: 600px; width: 100%; box-sizing: border-box; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; border: 1px solid #333; }
        .card.show { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Красивая заглушка вместо картинки */
        .image-placeholder { width: 100%; height: 250px; border-radius: 12px; margin-bottom: 20px; background: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%); display: flex; align-items: center; justify-content: center; border: 1px dashed #444; color: #666; font-size: 40px; }
        
        h2 { margin: 10px 0; color: #e50914; font-size: 24px; }
        .category-badge { display: inline-block; background: #333; color: #aaa; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 16px; line-height: 1.6; color: #ccc; text-align: left; margin-bottom: 0; }
    </style>
</head>
<body>

    <h1>🎲 Случайная поза</h1>
    
    <div class="controls">
        <select id="categorySelect">
            <option value="all">Все категории</option>
            <option value="Вагинальный">Вагинальный секс</option>
            <option value="Анальный">Анальный секс</option>
            <option value="Оральный">Оральный секс</option>
        </select>
        <button onclick="showRandomPose()">Показать позу</button>
    </div>

    <div id="poseCard" class="card">
        <div class="image-placeholder">🎴</div>
        <div class="category-badge" id="poseCategory"></div>
        <h2 id="poseTitle"></h2>
        <p id="poseDesc"></p>
    </div>

    <script>
        // Встроенная база данных (работает без интернета и запросов к сайту)
        const database = [
            // ВАГИНАЛЬНЫЙ
            { category: "Вагинальный", title: "Миссионерская", desc: "Классическая поза. Партнерша лежит на спине, партнер сверху. Позволяет смотреть друг другу в глаза, легко контролировать глубину и темп. Идеальна для неспешного, романтического секса." },
            { category: "Вагинальный", title: "Догги-стайл", desc: "Партнерша стоит на четвереньках, партнер сзади. Обеспечивает очень глубокое проникновение и стимуляцию передней стенки влагалища. Отлично подходит для быстрого и интенсивного темпа." },
            { category: "Вагинальный", title: "Наездница (Женщина сверху)", desc: "Партнер лежит на спине, партнерша сверху лицом к нему. Женщина полностью контролирует темп, угол и глубину. Отличный обзор друг друга и удобная стимуляция клитора." },
            { category: "Вагинальный", title: "Обратная наездница", desc: "Партнерша сверху спиной к партнеру. Меняется угол проникновения, создается сильное давление на переднюю стенку влагалища. Требует уверенности в движениях." },
            { category: "Вагинальный", title: "Ложки", desc: "Оба партнера лежат на боку, партнер сзади. Поза для расслабленного, медленного секса. Удобна при усталости, позволяет ласкать грудь и клитор." },
            { category: "Вагинальный", title: "Бабочка", desc: "Партнерша лежит на спине, партнер на коленях между ее ног, ступни партнерши у него на груди или плечах. Обеспечивает очень глубокое проникновение и стимуляцию точки G." },
            { category: "Вагинальный", title: "Стоя у стены", desc: "Партнерша прижата спиной к стене, партнер держит ее на весу. Максимальная близость и страсть. Требует хорошей физической формы от партнера." },
            { category: "Вагинальный", title: "Кресло (Лотос)", desc: "Партнер сидит на стуле, партнерша сверху лицом к нему, обхватывая его ногами. Поза для очень интимного, медленного секса с обилием поцелуев." },

            // АНАЛЬНЫЙ
            { category: "Анальный", title: "Анальный догги-стайл", desc: "Классика для анального секса. Партнерша на четвереньках, партнер сзади. Позволяет легко контролировать угол и добавлять смазку. Расслабьте мышцы для комфорта." },
            { category: "Анальный", title: "Ложки (Анальный)", desc: "Лежа на боку. Удобная поза для начала, так как позволяет партнерше расслабиться и контролировать процесс, прижимая ноги." },
            { category: "Анальный", title: "Наездница спиной", desc: "Партнерша сверху спиной к партнеру. Дает женщине полный контроль над глубиной и скоростью, что важно для комфорта при анальном сексе." },
            { category: "Анальный", title: "Миссионерская с подушкой", desc: "Партнерша лежит на спине с подушкой под тазом, ноги подняты. Обеспечивает удобный угол для проникновения и зрительный контакт." },

            // ОРАЛЬНЫЙ
            { category: "Оральный", title: "Поза 69", desc: "Партнеры лежат друг на друге в противоположных направлениях. Позволяет одновременно стимулировать друг друга. Отличный вариант для прелюдии." },
            { category: "Оральный", title: "Минет стоя", desc: "Партнер стоит, партнерша на коленях перед ним. Классическая поза, позволяющая партнерше полностью сконцентрироваться на процессе." },
            { category: "Оральный", title: "Кунилингус на краю кровати", desc: "Партнерша лежит на спине на краю кровати, партнер стоит на коленях на полу. Очень удобная поза для партнера, позволяющая использовать руки и язык." },
            { category: "Оральный", title: "Кунилингус с подушкой", desc: "Партнерша лежит на спине, под таз подложена подушка (или свернутое одеяло). Улучшает доступ и угол, позволяя партнеру глубже стимулировать зону клитора." },
            { category: "Оральный", title: "Минет сбоку (Ложки)", desc: "Партнер лежит на спине, партнерша лежит на боку рядом, лаская его ртом. Расслабленная и интимная поза для долгой прелюдии." }
        ];

        function showRandomPose() {
            const category = document.getElementById('categorySelect').value;
            
            // Фильтруем базу данных по выбранной категории
            const filtered = category === "all" 
                ? database 
                : database.filter(p => p.category === category);

            if (filtered.length === 0) return;

            // Выбираем случайную позу
            const randomPose = filtered[Math.floor(Math.random() * filtered.length)];

            // Показываем карточку
            const card = document.getElementById('poseCard');
            card.classList.remove('show');
            
            // Небольшая задержка для перезапуска анимации
            setTimeout(() => {
                document.getElementById('poseCategory').textContent = randomPose.category;
                document.getElementById('poseTitle').textContent = randomPose.title;
                document.getElementById('poseDesc').textContent = randomPose.desc;
                card.classList.add('show');
            }, 50);
        }
    </script>
</body>
</html>
