<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Sex Position Picker</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        h1 { margin-bottom: 10px; text-align: center; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; }
        select, button { padding: 12px; font-size: 16px; border-radius: 8px; border: none; outline: none; font-weight: bold; }
        select { background: #333; color: white; flex: 1; cursor: pointer; }
        button { background-color: #e50914; color: white; cursor: pointer; transition: 0.2s; flex: 1; }
        button:hover { background-color: #ff2b36; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .card { background: #2a2a2a; border-radius: 12px; padding: 20px; max-width: 600px; width: 100%; box-sizing: border-box; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: none; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card img { max-width: 100%; max-height: 450px; border-radius: 8px; margin-bottom: 15px; object-fit: cover; background: #111; }
        h2 { margin: 10px 0; color: #e50914; }
        p { font-size: 16px; line-height: 1.5; color: #dcdcdc; text-align: left; }
        .loader { margin-top: 50px; font-size: 18px; color: #888; text-align: center; }
        .error { color: #ff6b6b; margin-top: 20px; text-align: center; max-width: 600px; }
    </style>
</head>
<body>
    <h1>🎲 Случайная поза</h1>
    <div class="controls">
        <select id="categorySelect">
            <option value="https://medow.club/pozy/vid-seksa/vaginalnyj-seks">Вагинальный секс</option>
            <option value="https://medow.club/pozy/vid-seksa/analnyj-seks">Анальный секс</option>
            <option value="https://medow.club/pozy/vid-seksa/oralnyj-seks">Оральный секс</option>
            <option value="https://medow.club/pozy/vid-seksa/poza-69">Поза 69</option>
            <option value="https://medow.club/pozy/vid-seksa/minet">Минет</option>
            <option value="https://medow.club/pozy/vid-seksa/kunilingus">Кунилингус</option>
        </select>
        <button id="randomBtn" onclick="showRandomPose()">Показать позу</button>
    </div>
    <div id="loader" class="loader" style="display:none;">Поиск рабочего сервера и загрузка...<br><span style="font-size:12px;color:#555;">(может занять до 10 секунд)</span></div>
    <div id="errorMsg" class="error" style="display:none;"></div>
    
    <div id="poseCard" class="card">
        <img id="poseImage" src="" alt="Загрузка..." style="display:none;">
        <h2 id="poseTitle"></h2>
        <p id="poseDesc"></p>
    </div>

    <script>
        let posesCache = {};

        // Список из 6 разных прокси на случай, если какие-то заблокированы
        const PROXIES = [
            (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            (url) => `https://api.cors.lol/?url=${encodeURIComponent(url)}`,
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
            (url) => `https://api.corsfix.com/?url=${encodeURIComponent(url)}`
        ];

        async function fetchWithFallback(url) {
            for (let i = 0; i < PROXIES.length; i++) {
                try {
                    console.log(`Пробуем прокси ${i + 1}...`);
                    const res = await fetch(PROXIES[i](url));
                    if (res.ok) {
                        const text = await res.text();
                        // Если пришла страница с ошибкой Cloudflare, пропускаем этот прокси
                        if (text.includes("Наказание") || text.includes("Cloudflare") || text.length < 1000) {
                            continue;
                        }
                        return text; // Успех!
                    }
                } catch (e) {
                    console.log(`Прокси ${i + 1} не сработал.`);
                }
            }
            throw new Error("Все 6 прокси-серверов заблокированы сайтом.");
        }

        async function showRandomPose() {
            const btn = document.getElementById('randomBtn');
            const loader = document.getElementById('loader');
            const card = document.getElementById('poseCard');
            const errorMsg = document.getElementById('errorMsg');
            const catUrl = document.getElementById('categorySelect').value;

            if (posesCache[catUrl] && posesCache[catUrl].length > 0) {
                renderPose(posesCache[catUrl]);
                return;
            }

            btn.disabled = true;
            card.style.display = 'none';
            errorMsg.style.display = 'none';
            loader.style.display = 'block';

            try {
                const htmlText = await fetchWithFallback(catUrl);

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Ищем все блоки, где могут быть позы
                const links = doc.querySelectorAll('a[href*="/pozy/"]');
                let poses = [];
                let seen = new Set();

                links.forEach(link => {
                    const title = link.textContent.trim();
                    if (!title || title.length < 3 || seen.has(title) || title.includes("Наказание")) return;
                    seen.add(title);

                    // Ищем картинку внутри ссылки или в родительском блоке
                    let img = link.querySelector('img') || link.parentElement?.querySelector('img') || link.parentElement?.parentElement?.querySelector('img');
                    let imgUrl = '';
                    
                    if (img) {
                        let src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src');
                        if (src && !src.startsWith('data:')) {
                            if (src.startsWith('//')) src = 'https:' + src;
                            else if (src.startsWith('/')) src = 'https://medow.club' + src;
                            
                            // Пропускаем картинку через кэш, чтобы она не блокировалась
                            imgUrl = 'https://wsrv.nl/?url=' + encodeURIComponent(src) + '&w=600&output=webp';
                        }
                    }

                    // Ищем текст описания
                    let desc = 'Нажмите кнопку еще раз, чтобы увидеть другую позу.';
                    let p = link.parentElement?.querySelector('p');
                    if (p && p.textContent.trim().length > 10) {
                        desc = p.textContent.trim();
                    }

                    poses.push({ title, description: desc, image: imgUrl });
                });

                if (poses.length === 0) throw new Error("Не удалось распознать позы на странице.");

                posesCache[catUrl] = poses;
                renderPose(poses);
            } catch (error) {
                errorMsg.textContent = "Ошибка: " + error.message + " Попробуйте еще раз через 5 секунд.";
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function renderPose(poses) {
            const card = document.getElementById('poseCard');
            const randomPose = poses[Math.floor(Math.random() * poses.length)];
            
            document.getElementById('poseTitle').textContent = randomPose.title;
            document.getElementById('poseDesc').textContent = randomPose.description;
            
            const img = document.getElementById('poseImage');
            if (randomPose.image) {
                img.src = randomPose.image;
                img.style.display = 'block';
                img.onerror = () => { img.style.display = 'none'; };
            } else { 
                img.style.display = 'none'; 
            }
            card.style.display = 'block';
        }
    </script>
</body>
</html>
