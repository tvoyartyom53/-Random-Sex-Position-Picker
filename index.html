<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайная поза</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
        }
        h1 { margin-bottom: 20px; text-align: center; font-weight: 600; }
        
        .controls { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 100%; 
            max-width: 600px; 
        }
        
        button { 
            background-color: #8b1743; /* Цвет сайта Medow */
            color: white; 
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(139, 23, 67, 0.4);
        }
        
        button:hover { 
            background-color: #a81c52; 
            transform: translateY(-2px);
        }

        button:active { transform: translateY(0); }
        
        .card { 
            background: #262626; 
            border-radius: 16px; 
            padding: 25px; 
            max-width: 600px; 
            width: 100%; 
            box-sizing: border-box; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            display: none; 
            border: 1px solid #333;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* Стильная заглушка вместо картинки */
        .image-placeholder { 
            width: 100%; 
            height: 250px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            background: linear-gradient(135deg, #4a0e22 0%, #1c1c1c 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid #4a0e22; 
            color: #ff4d79; 
            font-size: 60px; 
            position: relative;
            overflow: hidden;
        }
        
        /* Имитация фигур с картинок (желтый и бордовый) */
        .image-placeholder::before, .image-placeholder::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
        }
        .image-placeholder::before {
            width: 150px; height: 150px;
            background: #ffcc00;
            top: -20px; left: 20px;
        }
        .image-placeholder::after {
            width: 200px; height: 200px;
            background: #8b1743;
            bottom: -50px; right: -20px;
        }

        h2 { margin: 10px 0 15px 0; color: #ff4d79; font-size: 22px; }
        p { font-size: 16px; line-height: 1.6; color: #dcdcdc; text-align: left; margin-bottom: 0; }
        
        .footer { margin-top: 30px; color: #666; font-size: 12px; text-align: center; }
    </style>
</head>

                desc: "Занимаясь любовью важно не просто ощущать своего партнера, а научиться играть на струнах его тела, только тогда вы сможете достигнуть настоящего удовлетворения. В позе Эротика женщина ложится на бок, поднимает верхнюю часть своего тела на локте и одну ногу. Мужчина усаживается между ног партнерши так, чтобы ее поднятая нога оказалась лежащей у него на боку. Руки партнер ставит на пол и делает на них упор, при желании, одной рукой он может ласкать грудь своей избранницы или даже стимулировать ее промежность для большего удовлетворения." 
            }
        ];

        function showRandomPose() {
            // Выбираем случайную позу из базы
            const randomPose = database[Math.floor(Math.random() * database.length)];

            // Показываем карточку
            const card = document.getElementById('poseCard');
            card.style.display = 'none';
            
            // Небольшая задержка для перезапуска анимации
            setTimeout(() => {
                document.getElementById('poseTitle').textContent = randomPose.title;
                document.getElementById('poseDesc').textContent = randomPose.desc;
                card.style.display = 'block';
            }, 50);
        }
    </script>
</body>
